name: injury-check
on:
  schedule:
    - cron: "7,22,37,52 0-5,14-23 * * *"   # every 15 minutes, 14:00-06:00 UTC (NBA news window)
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: update-nba, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch the injury report
        run: python scripts/fetch.py inj
      - name: Rebuild only if the injury report changed
        run: |
          if git diff --quiet -- data/injuries.json; then echo "No injury changes"; exit 0; fi
          git diff --stat -- data/injuries.json
          python scripts/build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data out
          git commit -qm "injury update $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && exit 0; sleep 10; done; exit 1
