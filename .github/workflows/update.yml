name: update-nba
on:
  schedule:
    # GitHub often starts scheduled runs 5-60+ minutes late, so there are four chances; the first one
    # that starts between 07:00 and 12:59 UK does the day's update and the rest skip.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update.yml"]
permissions: {contents: write}
concurrency: {group: update-nba, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run the schedule once a day, the first time it starts between 07:00 and 12:59 UK
        if: github.event_name == 'schedule'
        run: |
          h=$(TZ=Europe/London date +%H); today=$(TZ=Europe/London date +%F)
          last=$(cat data/main_update_date.txt 2>/dev/null || echo none)
          if [ "$h" -lt 7 ] || [ "$h" -gt 12 ]; then echo "SKIP=1" >> $GITHUB_ENV; echo "UK hour $h is outside 07-12, skipping";
          elif [ "$last" = "$today" ]; then echo "SKIP=1" >> $GITHUB_ENV; echo "Today's update already done";
          else echo "Running today's update (UK $h:xx)"; fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with: {python-version: "3.12"}
      - run: pip install -q pdfplumber
      - name: Fetch box scores, schedule, rosters, injuries
        if: env.SKIP != '1'
        run: |
          if [ "$PREGAME" = "1" ]; then python scripts/fetch.py espn || echo "FETCH_FAILED=1" >> $GITHUB_ENV
          else python scripts/fetch.py || echo "FETCH_FAILED=1" >> $GITHUB_ENV; fi
      - name: Fact-check against ESPN
        if: env.SKIP != '1'
        run: python scripts/verify.py
      - name: Build CSVs
        if: env.SKIP != '1'
        run: python scripts/build.py && python scripts/tiers.py
      - name: Push tier master to the private Google Sheet
        if: env.SKIP != '1'
        continue-on-error: true
        env: {GOOGLE_SA_JSON: "${{ secrets.GOOGLE_SA_JSON }}"}
        run: pip install -q gspread && python scripts/push_sheets.py
      - name: Commit results
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TZ=Europe/London date +%F > data/main_update_date.txt
          git add data out
          git commit -qm "update $(TZ=Europe/London date '+%Y-%m-%d %H:%M')" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && exit 0; sleep 10; done; exit 1
      - name: Fail the run if fetching failed (sends GitHub's failure email)
        if: env.SKIP != '1' && env.FETCH_FAILED == '1'
        run: |
          echo "A fetch step failed - see data/last_fetch_log.txt"
          exit 1
      - name: Tell healthchecks.io the update finished
        if: success() && env.SKIP != '1' && env.PREGAME != '1' && github.event_name != 'push'
        env: {HC: "${{ secrets.HC_PING_URL }}"}
        run: |
          if [ -z "$HC" ]; then echo "HC_PING_URL secret not set"; exit 0; fi
          curl -fsS -m 10 --retry 5 "$HC" && echo "Pinged healthchecks.io (success)"
      - name: Tell healthchecks.io the update failed
        if: failure() && env.SKIP != '1' && env.PREGAME != '1' && github.event_name != 'push'
        env: {HC: "${{ secrets.HC_PING_URL }}"}
        run: '[ -n "$HC" ] && curl -fsS -m 10 --retry 5 "$HC/fail" || true'
