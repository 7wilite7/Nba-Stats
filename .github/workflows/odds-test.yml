name: odds-test
on: {workflow_dispatch: {}}
permissions: {contents: write}
concurrency: {group: update-nba, cancel-in-progress: false}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Ask OddsPapi what it has for tonight's NBA games
        env: {ODDSPAPI_KEY: "${{ secrets.ODDSPAPI_KEY }}"}
        run: python scripts/odds_probe.py
      - name: Commit the sample
        run: |
          if [ -z "$(git status --porcelain -- data/odds_probe)" ]; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds_probe && git commit -qm "odds probe $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && exit 0; sleep 10; done; exit 1
