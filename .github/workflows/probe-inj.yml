name: probe-inj
on: {push: {paths: [tmp/probe_inj.py, .github/workflows/probe-inj.yml]}}
permissions: {contents: write}
concurrency: {group: update-nba, cancel-in-progress: false}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp/probe_inj.py; cat tmp/probe_inj.json
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/probe_inj.json && git commit -qm "probe injury report" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
